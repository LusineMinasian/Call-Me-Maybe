[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling for small LLMs with constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic>=2",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ['^llm_sdk/', '^\.venv/']